[project]
name = "data-etl"
version = "0.1.0"
description = "ETL pipeline for Hong Kong building footprints GeoJSON data"
license = { text = "MIT" }
readme = "README.md"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
ruff = "0.14.8"
black = "25.12.0"
mypy-extensions = "1.1.0"
pytest-cov = "^7.0.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12, <3.13"
psycopg = { extras = ["binary"], version = ">=3.1.0" }
geojson = ">=3.1.0"
requests = ">=2.31.0"
shapely = ">=2.0.0"
python-dotenv = ">=1.0.0"
colorlog = ">=6.8.0"


[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
